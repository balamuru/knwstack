# NATS Configuration for High-Throughput KnwStack
jetstream: {
    store_dir: "/data"
}

# Increase max payload to 128MB
max_payload: 134217728

# Increase max pending to 1GB to avoid Slow Consumer disconnects during mega-stress
max_pending: 1073741824

# Monitoring port
http_port: 8222

# Increase connection limits
max_connections: 65536
