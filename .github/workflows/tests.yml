name: KnwStack Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libarrow-dev

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Run Tests
      run: uv run pytest
