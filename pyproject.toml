[project]
name = "knwstack"
version = "0.1.0"
description = "A high-performance, low-latency reference architecture for real-time AI inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bytewax>=0.20.0",
    "nats-py>=2.8.0",
    "litellm>=1.35.0",
    "pydantic>=2.7.0",
    "asyncio>=3.4.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
knwstack-scaffold = "knwstack.cli.scaffold:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
